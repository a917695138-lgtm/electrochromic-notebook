<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>实验记录本</title>
<meta name="theme-color" content="#f6f8f7">
<style>
/* ===== FONTS & BASE ===== */
:root {
  --c-text: #18202f;
  --c-muted: #657286;
  --c-border: #d9e1e8;
  --c-border-strong: #c0ccd8;
  --c-bg: #f6f8f7;
  --c-surface: #fff;
  --c-surface-2: #f8fbfa;
  --c-ink: #111827;
  --c-accent: #1d4ed8;
  --c-accent-strong: #173f9b;
  --c-pbi: #f97316;
  --c-pbi-soft: #fff3e8;
  --c-volt: #1d4ed8;
  --c-temp: #b45309;
  --c-conc: #047857;
  --c-warn: #dc2626;
  --c-tag: #5b3fb5;
  --shadow-sm: 0 1px 2px rgba(15, 23, 42, .05);
  --shadow-md: 0 12px 30px rgba(24, 32, 47, .09);
  --font-ui: SimHei, "黑体", Arial, sans-serif;
  --font-text: SimHei, "黑体", Arial, serif;
  --font-mono: "Cascadia Code", Consolas, monospace;
  --radius: 8px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{background:var(--c-bg);scroll-behavior:smooth}
body{font-family:var(--font-ui);background:
  linear-gradient(90deg, rgba(29,78,216,.045) 1px, transparent 1px) 0 0/44px 44px,
  linear-gradient(0deg, rgba(249,115,22,.038) 1px, transparent 1px) 0 0/44px 44px,
  var(--c-bg);color:var(--c-text);line-height:1.6;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{overflow-x:hidden}
.visually-hidden{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip-link{position:fixed;left:16px;top:12px;z-index:1000;transform:translateY(-140%);padding:8px 12px;border-radius:var(--radius);background:var(--c-ink);color:#fff;text-decoration:none;font-size:12px;transition:transform .18s ease}
.skip-link:focus-visible{transform:translateY(0)}

/* ===== TOP BAR ===== */
.topbar{display:flex;align-items:center;gap:12px;padding:12px max(24px,env(safe-area-inset-right)) 12px max(24px,env(safe-area-inset-left));background:rgba(255,255,255,.9);backdrop-filter:blur(14px);border-bottom:1px solid rgba(217,225,232,.85);box-shadow:var(--shadow-sm);position:sticky;top:0;z-index:30}
.brand-lockup{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{display:grid;place-items:center;width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,#1d4ed8,#f97316);color:#fff;font-size:11px;font-weight:800;letter-spacing:.08em;box-shadow:0 10px 20px rgba(29,78,216,.15)}
.topbar h1{font-size:16px;font-weight:800;letter-spacing:0;line-height:1.15;text-wrap:balance}
.brand-context{display:block;margin-top:1px;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--c-muted)}
.topbar .spacer{flex:1}
.topbar .stats{display:flex;gap:8px;font-size:11px;color:var(--c-muted);flex-wrap:wrap;justify-content:flex-end}
.topbar .stats span{white-space:nowrap}
.topbar .stats span{display:inline-flex;align-items:center;gap:4px;min-height:26px;padding:3px 8px;border:1px solid rgba(217,225,232,.9);border-radius:999px;background:rgba(255,255,255,.72)}
.topbar .stats b{color:var(--c-text);font-weight:800;font-variant-numeric:tabular-nums}
.btn{min-height:32px;padding:6px 14px;border:1px solid var(--c-border-strong);border-radius:var(--radius);background:var(--c-surface);font-size:12px;font-weight:700;cursor:pointer;color:#263244;white-space:nowrap;font-family:var(--font-ui);transition:background-color .15s ease,border-color .15s ease,color .15s ease,box-shadow .15s ease,transform .15s ease;touch-action:manipulation}
.btn:hover{background:#f5f7fa;border-color:#aebccb;box-shadow:var(--shadow-sm)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible,.filters select:focus-visible,.filters input:focus-visible,.modal input:focus-visible,.pw-gate input:focus-visible,.edit-panel-body input:focus-visible,.edit-panel-body select:focus-visible,.edit-textarea:focus-visible,.tab:focus-visible,.month-header:focus-visible,.expand-btn:focus-visible,.inline-link:focus-visible,.toc-item:focus-visible,.raw-source summary:focus-visible{outline:3px solid rgba(249,115,22,.28);outline-offset:2px}
.btn.primary{background:var(--c-accent);color:#fff;border-color:var(--c-accent);box-shadow:0 8px 18px rgba(29,78,216,.18)}
.btn.primary:hover{background:var(--c-accent-strong);border-color:var(--c-accent-strong)}
.btn.danger{color:var(--c-warn);border-color:#fca5a5}
.btn.danger:hover{background:#fef2f2}
.btn.ghost{border-color:transparent;background:transparent;color:var(--c-muted)}
.btn.ghost:hover{background:#eef3f8;color:var(--c-text)}

/* ===== FILTER BAR ===== */
.filters{display:flex;gap:8px;padding:10px max(24px,env(safe-area-inset-right)) 10px max(24px,env(safe-area-inset-left));background:rgba(255,255,255,.86);backdrop-filter:blur(14px);border-bottom:1px solid rgba(217,225,232,.85);align-items:center;flex-shrink:0;flex-wrap:wrap;position:sticky;top:59px;z-index:25}
.filters select,.filters input{min-height:34px;padding:6px 10px;border:1px solid var(--c-border-strong);border-radius:var(--radius);font-size:12px;background-color:var(--c-surface);color:var(--c-text);font-family:var(--font-ui)}
.filters select{font-weight:650}
.filters input.search{flex:1;min-width:220px;max-width:440px}
.filters .cnt{font-size:11px;color:var(--c-muted);margin-left:auto;font-variant-numeric:tabular-nums}

/* ===== MAIN CONTENT AREA ===== */
.main-area{flex:1;overflow-y:auto;padding:0 24px 24px}
.main-area.list{padding:12px 24px 24px}
.main-area.read,.main-area.edit{padding:16px 24px 24px}

/* ===== LIST VIEW ===== */
.month-group{margin-bottom:14px;content-visibility:auto;contain-intrinsic-size:120px 460px}
.month-header{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;font-family:var(--font-ui);font-size:13px;font-weight:800;text-align:left;color:var(--c-text);cursor:pointer;user-select:none;border-radius:8px 8px 0 0;margin:4px 0 0;white-space:nowrap;background:linear-gradient(90deg,#fff,var(--c-surface-2));border:1px solid var(--c-border);border-bottom:none;box-shadow:var(--shadow-sm)}
.month-header:hover{background:#f7fafc}
.month-header .chevron{font-size:10px;transition:transform .2s;display:inline-block;width:14px}
.month-header.collapsed .chevron{transform:rotate(-90deg)}
.month-header .count{font-size:11px;font-weight:500;color:var(--c-muted)}
.month-header .month-meta{margin-left:auto;font-size:11px;color:var(--c-muted);font-weight:500}
.section-heading{display:flex;flex-direction:column;gap:1px;min-width:0;white-space:normal}
.section-title{font-size:13px;font-weight:900;line-height:1.25}
.section-caption{font-size:11px;font-weight:550;color:var(--c-muted);line-height:1.35}
.section-group .month-header{align-items:flex-start}
.section-group .month-header .count{margin-top:1px}
.section-group .month-header .month-meta{margin-top:1px}
.plan-section .month-header{background:linear-gradient(90deg,#ecfeff,#fff);border-color:#a5f3fc}
.plan-section .month-body{border-color:#a5f3fc}
.method-section .month-header{background:linear-gradient(90deg,#f5f3ff,#fff);border-color:#ddd6fe}
.method-section .month-body{border-color:#ddd6fe}

.month-body{background:var(--c-surface);border:1px solid var(--c-border);border-radius:0 0 8px 8px;overflow:hidden;box-shadow:var(--shadow-sm)}
.record-table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13px;margin-bottom:0}
.record-table thead th{text-align:left;padding:10px 12px;background:#f7fafc;border-bottom:1px solid var(--c-border);font-weight:800;color:var(--c-muted);font-size:11px;letter-spacing:0;white-space:nowrap}
.record-table tbody td{padding:10px 12px;border-bottom:1px solid #edf2f7;vertical-align:top;white-space:nowrap}
.record-table tbody tr{cursor:pointer;transition:background .1s}
.record-table tbody tr:nth-child(even){background:#fbfcfe}
.record-table tbody tr:hover{background:#f0f7ff}
.record-table tbody tr:focus-visible{outline:3px solid rgba(249,115,22,.28);outline-offset:-3px}
.record-table tbody tr.pbi-row td:first-child{border-left:3px solid var(--c-pbi)}
.record-table .col-date{width:76px;color:var(--c-muted);font-size:12px;white-space:nowrap}
.record-table .col-type{width:88px;white-space:nowrap}
.record-table .col-cat{width:110px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.record-table .col-title{font-weight:500;white-space:normal}
.record-table .col-status{width:86px;white-space:nowrap}
.record-table .col-tags{width:220px;overflow:hidden}
.record-table .col-expand{width:34px;text-align:center;color:#94a3b8;font-size:14px}
.record-title-stack{display:grid;gap:6px;min-width:0}
.record-title{font-size:13px;font-weight:800;line-height:1.45;color:var(--c-text);min-width:0;overflow-wrap:anywhere}
.record-title-btn{display:inline;text-align:left;border:0;background:transparent;color:inherit;font:inherit;font-weight:800;cursor:pointer;padding:0;overflow-wrap:anywhere}
.record-title-btn:hover{color:var(--c-accent)}
.record-title-btn:focus-visible{outline:3px solid rgba(249,115,22,.28);outline-offset:3px;border-radius:4px}
.row-toc{max-width:100%;border:1px solid #e2eaf3;border-radius:8px;background:#fbfdff;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.row-toc>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:6px;min-width:0;padding:5px 7px;color:#334155;font-size:11px;font-weight:850;line-height:1.35;white-space:normal;overflow-wrap:anywhere}
.row-toc>summary::-webkit-details-marker{display:none}
.row-toc>summary:before{content:"▸";flex:0 0 auto;color:#64748b;font-size:10px}
.row-toc[open]>summary:before{content:"▾"}
.row-toc:not([open])>summary{background:#f8fafc;border-radius:8px}
.row-toc-count{flex:0 0 auto;margin-left:auto;padding:1px 6px;border-radius:999px;background:#eef2ff;color:#475569;font-size:10px;font-weight:800;white-space:nowrap}
.row-toc>.home-toc-list{padding:0 7px 7px;max-height:260px;overflow:auto}
.row-toc .home-toc-list{gap:3px}
.row-toc .home-toc-list ul{margin-top:3px}
.row-toc .home-toc-node{font-size:11px;line-height:1.4}
.row-toc .home-toc-node details>summary,.row-toc .home-toc-node.leaf{padding:2px 5px}

.type-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
.type-dot.experiment{background:#2563eb}
.type-dot.plan{background:#0891b2}
.type-dot.method{background:#7c3aed}
.type-dot.note{background:#059669}
.type-dot.data{background:#d97706}
.type-dot.reminder{background:#dc2626}

.tag-pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10px;margin:1px 2px;background:#f1edff;color:var(--c-tag);white-space:nowrap;border:1px solid rgba(91,63,181,.14)}
.tag-pill.tag-spectro{background:#e0f2fe;color:#075985;border-color:#7dd3fc;font-weight:800}
.tag-pill.tag-thickness{background:#dcfce7;color:#166534;border-color:#86efac;font-weight:800}
.tag-pill.tag-cycling{background:#fee2e2;color:#991b1b;border-color:#fecaca;font-weight:800}
.tag-pill.tag-electrochem{background:#ede9fe;color:#5b21b6;border-color:#c4b5fd;font-weight:800}
.tag-pill.tag-organized{background:#fef9c3;color:#854d0e;border-color:#fde68a;font-weight:800}
.title-data-badge{display:inline-flex;align-items:center;max-width:100%;padding:1px 7px;margin:0 6px 2px 0;border-radius:999px;font-size:10px;line-height:1.55;font-weight:900;border:1px solid rgba(91,63,181,.14);vertical-align:baseline;white-space:nowrap}
.title-data-badge.tag-spectro{background:#e0f2fe;color:#075985;border-color:#7dd3fc}
.title-data-badge.tag-thickness{background:#dcfce7;color:#166534;border-color:#86efac}
.title-data-badge.tag-cycling{background:#fee2e2;color:#991b1b;border-color:#fecaca}
.title-data-badge.tag-electrochem{background:#ede9fe;color:#5b21b6;border-color:#c4b5fd}
.status-badge{font-size:10px;padding:2px 8px;border-radius:999px;font-weight:800;white-space:nowrap;display:inline-block;letter-spacing:0}
.muted-dash{color:#a0adbc;font-size:11px}
.expand-btn{display:grid;place-items:center;width:26px;height:26px;margin:auto;border:1px solid transparent;border-radius:8px;background:transparent;color:#7a8aa0;cursor:pointer;font-size:14px;line-height:1}
.expand-btn:hover{background:#eaf2ff;border-color:#c8dcff;color:var(--c-accent)}

.inline-preview{display:none;background:#fbfcff;border-bottom:1px solid #e5e7ff;font-family:var(--font-ui);font-size:13px;line-height:1.7}
.inline-preview.show{display:table-row}
.inline-preview td{display:table-cell;padding:0!important;white-space:normal!important}
.preview-shell{padding:12px 14px 14px;background:
  linear-gradient(90deg, rgba(29,78,216,.04) 1px, transparent 1px) 0 0/32px 32px,
  #fbfcff}
.inline-preview .ip-meta{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid #eee}
.inline-preview .ip-field{font-size:11px;color:var(--c-muted);white-space:nowrap}
.inline-preview .ip-field b{color:var(--c-text);font-weight:600}
.preview-grid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(280px,1.1fr);gap:12px;align-items:start}
.preview-panel{min-width:0;border:1px solid #e1e8f0;border-radius:8px;background:rgba(255,255,255,.86);padding:11px 12px;box-shadow:var(--shadow-sm)}
.preview-label{font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#64748b;margin-bottom:5px}
.preview-summary{font-family:var(--font-text);color:#263244;line-height:1.85;overflow-wrap:anywhere}
.key-facts{display:flex;flex-wrap:wrap;gap:6px;margin:9px 0 2px}
.key-fact{display:inline-flex;align-items:center;gap:4px;max-width:100%;padding:3px 8px;border-radius:999px;background:#eef5ff;border:1px solid #dbeafe;color:#1e3a8a;font-family:var(--font-ui);font-size:11px;font-weight:800;line-height:1.35;white-space:nowrap}
.key-fact.warn{background:#fff7ed;border-color:#fed7aa;color:#9a3412}
.key-fact.good{background:#ecfdf5;border-color:#bbf7d0;color:#166534}
.home-toc{min-width:0}
.home-toc>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:7px;font-size:11px;font-weight:900;color:#24324b;margin-bottom:6px}
.home-toc>summary::-webkit-details-marker{display:none}
.home-toc>summary:before{content:"▾";font-size:10px;color:#64748b;transition:transform .16s ease}
.home-toc:not([open])>summary:before{transform:rotate(-90deg)}
.home-toc-list{list-style:none;padding-left:0;display:grid;gap:4px}
.home-toc-list ul{list-style:none;margin:4px 0 0 12px;padding-left:10px;border-left:1px solid #d8e2ee;display:grid;gap:4px}
.home-toc-list li{min-width:0}
.home-toc-node{border-radius:6px;color:#334155;font-size:12px;line-height:1.45;overflow-wrap:anywhere}
.home-toc-node.leaf{padding:3px 6px;background:#f8fafc;border:1px solid transparent}
.home-toc-node details>summary{list-style:none;cursor:pointer;padding:3px 6px;border-radius:6px;background:#f8fafc;border:1px solid #e5edf5;font-weight:750}
.home-toc-node details>summary::-webkit-details-marker{display:none}
.home-toc-node details>summary:before{content:"▸";display:inline-block;width:12px;color:#64748b}
.home-toc-node details[open]>summary:before{content:"▾"}
.home-toc-node.l1>details>summary{background:#eef6ff;border-color:#cfe3ff;color:#1e3a8a}
.home-toc-node.l2>details>summary{background:#f8fafc;color:#334155}
.home-toc-node.leaf.l3{background:#fff;border-color:#edf2f7}
.home-toc-jump{display:inline;text-align:left;border:0;background:transparent;color:inherit;font:inherit;font-weight:inherit;padding:0;cursor:pointer;overflow-wrap:anywhere}
.home-toc-jump:hover{color:#1d4ed8;text-decoration:underline;text-underline-offset:2px}
.home-toc-node.leaf .home-toc-jump{width:100%}
.home-toc-empty{font-size:12px;color:var(--c-muted);padding:6px 0}
.inline-link{margin-top:6px;border:0;background:transparent;color:var(--c-accent);cursor:pointer;font-size:11px;font-weight:800;font-family:var(--font-ui);padding:2px 0}
.inline-link:hover{color:var(--c-pbi)}

.empty-state{text-align:center;padding:60px 20px;color:#8a96a8;font-family:var(--font-text)}

.read-container{max-width:1260px;margin:0 auto;background:transparent;border:none;overflow:visible}
.read-shell{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
.read-main{min-width:0;display:grid;gap:12px}
.read-hero{background:linear-gradient(135deg,#fff 0%,#fbfdff 72%,#fff7ed 100%);border:1px solid var(--c-border);border-radius:8px;padding:20px 22px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden}
.read-hero:before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--hero-accent,#2563eb)}
.read-hero.pbi-hero{border-color:#fed7aa;box-shadow:0 12px 28px rgba(249,115,22,.1)}
.read-hero-top{display:flex;gap:16px;align-items:flex-start}
.read-hero-title{flex:1;min-width:0}
.read-hero h2{font-size:23px;line-height:1.35;font-weight:700;font-family:var(--font-text);margin:0 0 6px;text-wrap:balance;overflow-wrap:anywhere}
.read-path{font-size:11px;color:var(--c-muted);word-break:break-all}
.read-excerpt{margin-top:10px;color:#253040;font-size:13px;line-height:1.85;max-width:72ch}
.read-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.read-chip{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:999px;background:#eef5ff;border:1px solid #dbeafe;font-size:11px;color:#274167;white-space:nowrap}
.read-chip strong{font-weight:700}
.read-fm{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px 14px;padding:14px 16px;background:var(--c-surface);border:1px solid var(--c-border);border-radius:8px;font-size:12px;box-shadow:var(--shadow-sm)}
.read-fm .fm-item{display:flex;gap:8px;align-items:flex-start;white-space:normal}
.read-fm .fm-key{color:var(--c-muted);white-space:nowrap;flex:0 0 auto}
.read-fm .fm-val{font-weight:600;min-width:0}
.read-fm .fm-tags{display:flex;gap:4px;flex-wrap:wrap}
.read-content{padding:20px 22px;font-size:14px;line-height:1.9;background:var(--c-surface);border:1px solid var(--c-border);border-radius:8px;box-shadow:var(--shadow-sm);font-family:var(--font-text)}
.read-content h1{font-size:19px;font-weight:850;margin:18px 0 12px;padding:8px 12px;border-left:5px solid #1d4ed8;border-bottom:1px solid #bfdbfe;border-radius:8px;background:#eff6ff;color:#1e3a8a;text-wrap:balance;scroll-margin-top:120px}
.read-content h2{font-size:16px;font-weight:820;margin:16px 0 9px;padding:6px 10px;border-left:4px solid #0f766e;border-radius:7px;background:#ecfdf5;color:#115e59;text-wrap:balance;scroll-margin-top:120px}
.read-content h3{font-size:13px;font-weight:800;margin:12px 0 7px;padding:4px 8px;border-left:3px solid #f97316;border-radius:6px;background:#fff7ed;color:#9a3412;scroll-margin-top:120px}
.read-content h1:target,.read-content h2:target,.read-content h3:target,.read-content .jump-focus{outline:3px solid rgba(249,115,22,.32);box-shadow:0 0 0 6px rgba(249,115,22,.12)}
.read-content p{margin:6px 0}
.read-content ul,.read-content ol{margin:4px 0;padding-left:22px}
.read-content li{margin:2px 0}
.read-content code{font-family:var(--font-mono);font-size:12px;background:#f5f5f5;padding:1px 5px;border-radius:3px}
.read-content pre{background:#f5f5f5;padding:12px 16px;border-radius:var(--radius);overflow-x:auto;font-size:12px;line-height:1.5;margin:8px 0;border:1px solid #e5e5e5}
.read-content pre code{background:none;padding:0}
.read-content a{color:#1d4ed8;font-weight:700;text-decoration:none;border-bottom:1px solid rgba(29,78,216,.28)}
.read-content a:hover{color:#b45309;border-bottom-color:#f59e0b;background:#fff7ed}
.read-content strong{font-weight:700}
.read-content em{font-style:italic}
.latin-text{font-family:Arial,sans-serif}
.table-wrap{margin:12px 0;overflow:auto;border:1px solid var(--c-border);border-radius:8px;background:#fff}
.read-content table{width:100%;border-collapse:collapse;font-size:12px;font-family:var(--font-ui)}
.read-content table thead th{padding:8px 10px;text-align:left;font-weight:700;font-size:11px;color:#24324b;background:#f8fafc;border-bottom:1px solid var(--c-border);white-space:nowrap}
.read-content table tbody td{padding:8px 10px;border-bottom:1px solid #edf2f7;vertical-align:top;font-variant-numeric:tabular-nums}

<script>
// ====== GLOBALS ======
var DB = typeof DB !== "undefined" ? DB : [];
var TYPES = {experiment:"实验",plan:"实验方案",method:"实验方法",note:"笔记",data:"数据",reminder:"提醒"};
var TYPE_FOLDERS = {experiment:"experiments",plan:"plans",method:"methods",note:"notes",data:"data",reminder:"reminders"};
var TYPE_CLASSES = {experiment:"experiment",plan:"plan",method:"method",note:"note",data:"data",reminder:"reminder"};
var TYPE_ACCENTS = {experiment:"#2563eb",plan:"#0891b2",method:"#7c3aed",note:"#059669",data:"#d97706",reminder:"#dc2626"};
var STATUS_COLORS = {planned:"#6b7280","in-progress":"#2563eb",completed:"#16a34a",pending:"#d97706",done:"#16a34a",needs_review:"#d97706"};
var STATUS_LABELS = {planned:"计划中","in-progress":"进行中",completed:"已完成",pending:"待处理",done:"已完成",needs_review:"待复核"};
var sortKey = "date", sortDesc = true;
var curIdx = -1, dirty = false;
var expandedRow = null;

// ====== INIT ======
function init() {
  try { localStorage.removeItem("labdb"); } catch(e) {}
  if (DB.length === 0) {
    var c = document.getElementById("listContent");
    if (c) c.innerHTML = '<div style="padding:40px 20px;text-align:center;color:#657286">数据加载失败：请确认同目录下 data.js 存在，然后刷新页面。</div>';
  }
  checkPassword();
  populateFilters();
  renderList();
  updateStats();
}

// ====== PARSING ======
function normalizeMarkdown(content) {
  return String(content || "").replace(/^\uFEFF/, "").replace(/\r\n/g, "\n").replace(/\r/g, "\n");
}

function parseFM(content) {
  content = normalizeMarkdown(content);
  var m = {type:"",title:"",date:"",modified:"",tags:[],project:"",status:"",category:"",priority:"",due:"",related:[],electrolyte:"",additive:"",counter_electrode:"",encapsulation:"",data_types:[]};
  if (!content || content.substring(0,4) !== "---\n") return m;
  var end = content.indexOf("\n---\n", 4);
  if (end < 0) return m;
  var fm = content.substring(4, end);
  var lines = fm.split("\n");
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i];
    var ci = line.indexOf(":");
    if (ci < 0) continue;
    var key = line.substring(0, ci).trim();
    var val = line.substring(ci + 1).trim();
    val = val.replace(/^"(.*)"$/, "$1");
    if (key === "tags" || key === "related" || key === "data_types") {
      try { m[key] = JSON.parse(val); } catch(e) { m[key] = val.replace(/[\[\]]/g,"").split(",").map(function(s){return s.trim().replace(/"/g,"")}); }
    } else if (m.hasOwnProperty(key)) { m[key] = val; }
  }
  return m;
}

function getBody(content) {
  content = normalizeMarkdown(content);
  if (!content || content.substring(0,4) !== "---\n") return content || "";
  var end = content.indexOf("\n---\n", 4);
  if (end < 0) return content;
  return content.substring(end + 5).trim();
}

function fmToString(meta) {
  var lines = ["---"];
  var fields = ["type","title","date","category","electrolyte","additive","counter_electrode","encapsulation","status","tags","priority","due","related","modified"];
  for (var i = 0; i < fields.length; i++) {
    var k = fields[i], v = meta[k];
    if (v === undefined || v === null || v === "") continue;
    if (k === "tags" || k === "related") { lines.push(k + ": " + JSON.stringify(v)); }
    else if (typeof v === "string" && (v.indexOf(":") >= 0 || v.indexOf("#") >= 0 || v.indexOf('"') >= 0)) { lines.push(k + ': "' + v + '"'); }
    else { lines.push(k + ": " + v); }
  }
  lines.push("---");
  return lines.join("\n");
}

// ====== FILTERS ======
function populateFilters() {
  var types = [], statuses = [];
  for (var i = 0; i < DB.length; i++) {
    var m = parseFM(DB[i].content);
    if (m.type && types.indexOf(m.type) < 0) types.push(m.type);
    if (m.status && statuses.indexOf(m.status) < 0) statuses.push(m.status);
  }
  types.sort(); statuses.sort();
  fillSelect("fType", types, TYPES);
  fillSelect("fStat", statuses, STATUS_LABELS);
}

function fillSelect(id, items, labels) {
  var sel = document.getElementById(id);
  while (sel.options.length > 1) sel.remove(1);
  for (var i = 0; i < items.length; i++) {
    var o = document.createElement("option");
    o.value = items[i];
    o.textContent = labels ? (labels[items[i]] || items[i]) : items[i];
    sel.appendChild(o);
  }
}

function escHtml(s) {
  if (!s) return "";
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function escAttr(s) {
  return escHtml(s).replace(/'/g,"&#39;");
}

function hasPbiSignal(text) {
  return /PBI(?:-Cl)?/i.test(String(text || ""));
}

function dataTagClass(tag) {
  var text = String(tag || "");
  if (/光谱电化学数据/.test(text)) return " tag-spectro";
  if (/膜厚数据/.test(text)) return " tag-thickness";
  if (/循环稳定性数据/.test(text)) return " tag-cycling";
  if (/电化学数据/.test(text)) return " tag-electrochem";
  if (/数据已整理/.test(text)) return " tag-organized";
  return "";
}

function renderTagPill(tag) {
  return '<span class="tag-pill' + dataTagClass(tag) + '">' + escHtml(tag) + '<\/span>';
}

function renderTitleWithBadges(title) {
  var rest = String(title || "");
  var html = "";
  var match;
  while ((match = rest.match(/^\[([^\]]+数据)\]\s*/))) {
    html += '<span class="title-data-badge' + dataTagClass(match[1]) + '">' + escHtml(match[1]) + '<\/span>';
    rest = rest.slice(match[0].length);
  }
  return html + renderMixedText(rest);
}

function normalizeMarkdownHref(href) {
  var out = String(href || "").trim().replace(/&amp;/g, "&").replace(/&quot;/g, '"');
  if (/^[A-Za-z]:[\\/]/.test(out)) out = "file:///" + out.replace(/\\/g, "/");
  if (/^file:\/\//i.test(out)) out = out.replace(/\\/g, "/");
  if (/^(https?:|file:|mailto:)/i.test(out)) return out;
  if (/^(data|experiments|plans|methods|notes|reminders)\//.test(out)) return out;
  if (/^\.\.?\//.test(out)) return out;
  return "";
}

function renderMarkdownLinks(html) {
  return html.replace(/\[([^\]\n]+)\]\(([^)\n]+)\)/g, function(_, text, href) {
    var safeHref = normalizeMarkdownHref(href);
    if (!safeHref) return text;
    return '<a href="' + escAttr(safeHref) + '" target="_blank" rel="noopener">' + text + '<\/a>';
  });
}

function applyLatinFont(html) {
  var parts = String(html || "").split(/(<[^>]+>|&(?:[A-Za-z]+|#\d+|#x[0-9A-Fa-f]+);)/g);
  var codeDepth = 0;
  for (var i = 0; i < parts.length; i++) {
    var part = parts[i];
    if (!part) continue;
    if (part.charAt(0) === "<") {
      if (/^<(pre|code)\b/i.test(part)) codeDepth++;
      else if (/^<\/(pre|code)>/i.test(part) && codeDepth > 0) codeDepth--;
      continue;
    }
    if (part.charAt(0) === "&") continue;
    if (codeDepth) continue;
    parts[i] = part.replace(/([A-Za-z0-9][A-Za-z0-9._+\-/:,%#=()[\]\s]*[A-Za-z0-9%)]|[A-Za-z0-9])/g, '<span class="latin-text" lang="en-US" style="font-family:Arial,sans-serif">$1<\/span>');
  }
  return parts.join("");
}

function renderMixedText(text) {
  return applyLatinFont(escHtml(text));
}

// ====== SMART HIGHLIGHTING ======
function highlightData(text) {
  // Already escaped text
  text = text.replace(/\b(PBI-Cl|PBI)\b/g, '<span class="hl-pbi">$1</span>');
  text = text.replace(/(-?\d+\.?\d*\s*V)/gi, '<span class="hl-volt">$1</span>');
  text = text.replace(/(\d+\.?\d*\s*℃)/g, '<span class="hl-temp">$1</span>');
  text = text.replace(/(\d+\.?\d*\s*min)/gi, '<span class="hl-temp">$1</span>');
  text = text.replace(/(\d+\.?\d*\s*h)/gi, '<span class="hl-temp">$1</span>');
  text = text.replace(/(\d+\.?\d*\s*[μu]L)/gi, '<span class="hl-conc">$1</span>');
  text = text.replace(/(\d+\.?\d*\s*mg)/gi, '<span class="hl-conc">$1</span>');
  text = text.replace(/(\d+\.?\d*\s*g\/mol)/gi, '<span class="hl-conc">$1</span>');
  text = text.replace(/(\d+\.?\d*\s*[mμn]?M\b)/g, '<span class="hl-conc">$1</span>');
  text = text.replace(/(\d+\.?\d*\s*mL)/gi, '<span class="hl-conc">$1</span>');
  text = text.replace(/(\d+\.?\d*\s*rpm)/gi, '<span class="hl-conc">$1</span>');
  text = text.replace(/(\d+\.?\d*\s*rpm\/s)/gi, '<span class="hl-conc">$1</span>');
  text = text.replace(/(\d+\.?\d*\s*s\b)/gi, '<span class="hl-conc">$1</span>');
  return text;
}

function makeSummary(body) {
  if (!body) return "";
  var text = body.replace(/^#+\s.*$/gm, "")
    .replace(/```[\s\S]*?```/g, "")
    .replace(/\|/g, " ")
    .replace(/\s+/g, " ")
    .trim();
  if (!text) return "";
  return text.slice(0, 180) + (text.length > 180 ? "…" : "");
}

function slugifyText(text, fallback) {
  var id = String(text || "").replace(/[`*_]/g, "").trim().toLowerCase().replace(/[^\w\u4e00-\u9fa5]+/g, "-").replace(/^-+|-+$/g, "");
  return id || fallback || "sec";
}

function buildToc(body) {
  if (!body) return [];
  var lines = body.split(/\r?\n/);
  var toc = [];
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i];
    var m = line.match(/^(#{1,3})\s+(.+)$/);
    if (!m) continue;
    var level = m[1].length;
    var text = m[2].replace(/[`*_]/g, "").trim();
    var id = slugifyText(text, "sec-" + i);
    toc.push({level: level, text: text, id: id});
  }
  return toc;
}

function renderToc(toc) {
  if (!toc || !toc.length) return '<div style="font-size:12px;color:var(--c-muted)">正文没有标题结构</div>';
  var html = '<div class="toc-list">';
  for (var i = 0; i < toc.length; i++) {
    html += '<a class="toc-item l' + toc[i].level + '" href="#' + toc[i].id + '">' + escHtml(toc[i].text) + '</a>';
  }
  html += '</div>';
  return html;
}

// ====== MARKDOWN TO HTML ======
function renderMarkdown(md) {
  if (!md) return "";
  var html = escHtml(md);
  // Code blocks
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, function(_,lang,code){ return '<pre><code>'+code+'<\/code><\/pre>'; });
  html = html.replace(/`([^`]+)`/g, '<code>$1<\/code>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1<\/strong>');
  html = html.replace(/\*(.+?)\*/g, '<em>$1<\/em>');
  html = html.replace(/^(#{1,3}) (.+)$/gm, function(_, hashes, text) {
    var level = hashes.length;
    var id = slugifyText(text, "sec");
    if (!id) id = "sec";
    return '<h' + level + ' id="' + id + '">' + text + '</h' + level + '>';
  });
  // Markdown tables
  html = html.replace(/((?:^\|.*\|\s*(?:\n|$)){2,})/gm, function(block) {
    var lines = block.trim().split(/\n/).filter(function(line){ return line.trim(); });
    if (lines.length < 2) return block;
    var header = parseTableLine(lines[0]);
    var sep = parseTableLine(lines[1]);
    if (!header.length || !sep.length || !sep.every(function(c){ return /^[\s\-:]+$/.test(c) && c.trim(); })) return block;
    var out = '<div class="table-wrap"><table><thead><tr>';
    out += header.map(function(c){ return '<th>'+c+'<\/th>'; }).join("");
    out += '<\/tr><\/thead><tbody>';
    for (var r = 2; r < lines.length; r++) {
      var cells = parseTableLine(lines[r]);
      if (!cells.length) continue;
      out += '<tr>' + cells.map(function(c){ return '<td>'+c+'<\/td>'; }).join("") + '<\/tr>';
    }
    out += '<\/tbody><\/table><\/div>';
    return out;
  });
  html = renderMarkdownLinks(html);
  html = html.replace(/^[\-\*] (.+)$/gm, '<li>$1<\/li>');
  html = html.replace(/^(\d+)\. (.+)$/gm, '<li>$2<\/li>');
  html = html.replace(/((?:<li>.*?<\/li>\n?)+)/g, '<ul>$1<\/ul>');
  html = html.replace(/\n\n+/g, '<\/p><p>');
  html = '<p>' + html + '<\/p>';
  html = html.replace(/<p><\/p>/g, '');
  html = html.replace(/<p>\s*<(h[1-3]|ul|pre|table|thead|div)/g, '<$1');
  html = html.replace(/<\/(h[1-3]|ul|table|tbody|div)>(\s*<\/p>)?/g, '<\/$1>');
  // Highlight data
  html = highlightData(html);
  html = applyLatinFont(html);
  // Separators
  html = html.replace(/^<p>-{3,}<\/p>$/gm, '<p class="sep">&mdash;</p>');
  return html;
}

function parseTableLine(line) {
  var text = line.trim();
  if (text.charAt(0) === "|") text = text.slice(1);
  if (text.charAt(text.length - 1) === "|") text = text.slice(0, -1);
  return text.split("|").map(function(c){ return c.trim(); });
}

function sortRecordIndices(indices) {
  return indices.sort(function(a, b) {
    var ma = parseFM(DB[a].content);
    var mb = parseFM(DB[b].content);
    var da = ma.date || ma.modified || "";
    var db = mb.date || mb.modified || "";
    if (da !== db) return da < db ? 1 : -1;
    return (ma.title || DB[a].name).localeCompare(mb.title || DB[b].name, "zh-CN");
  });
}

function listSectionStats(indices) {
  var cats = {}, types = {};
  for (var i = 0; i < indices.length; i++) {
    var m = parseFM(DB[indices[i]].content);
    if (m.category) cats[m.category] = true;
    if (m.type) types[m.type] = true;
  }
  return {cats: Object.keys(cats).length, types: Object.keys(types).length};
}

function dateCellLabel(meta) {
  if (meta.date) return meta.date.substring(5) || meta.date;

function renderList() {
  var container = document.getElementById("listContent");
  var planRecords = [];
  var methodRecords = [];
  var datedRecords = [];
  for (var i = 0; i < DB.length; i++) {
    var m = parseFM(DB[i].content);

    else if (m.type === "method") methodRecords.push(i);
    else datedRecords.push(i);
  }

  sortRecordIndices(planRecords);
  sortRecordIndices(methodRecords);
  sortRecordIndices(datedRecords);

  var html = "";
  html += renderListSection("实验方案", "计划、方案统一归档；不混入按日期实验记录", planRecords, "plan-section", true);
  html += renderListSection("实验方法", "测试方法与制备 SOP 单独索引；不再归入未标注日期", methodRecords, "method-section", true);

  var groups = {};
  for (var di = 0; di < datedRecords.length; di++) {
    var idxForMonth = datedRecords[di];
    var dm = parseFM(DB[idxForMonth].content);
    var month = (dm.date || "----").substring(0,7);
    if (!groups[month]) groups[month] = [];
    groups[month].push(idxForMonth);
  }
  var months = Object.keys(groups).sort().reverse();
  for (var mi = 0; mi < months.length; mi++) {
    var month = months[mi];

    var stats = listSectionStats(indices);
    var monthKey = "month-" + month;
    // 默认只展开最近一个月，其余折叠（手动折叠/展开过的按 localStorage 记忆）
    var collapsed = getCollapseState(monthKey, mi !== 0);
    html += '<div class="month-group">';
    html += '<button type="button"'+renderMonthHeaderAttrs(monthKey, collapsed)+'><span class="chevron" aria-hidden="true">▼</span> '+label+' <span class="count">'+indices.length+' 条</span><span class="month-meta">'+stats.cats+' 个分类 · '+stats.types+' 种类型</span></button>';
    html += '<div class="month-body"'+(collapsed ? ' style="display:none"' : '')+'>';
    html += renderRecordTable(indices);

  if (!planRecords.length && !methodRecords.length && !Object.keys(groups).length) {
    html = '<div class="empty-state"><p>没有匹配的记录</p></div>';

  container.innerHTML = html;
  filter();

function tocTree(toc) {
  var root = [];
  var stack = [{level: 0, children: root}];
  for (var i = 0; i < toc.length; i++) {
    var item = toc[i];
    if (item.level > 3) continue;
    while (stack.length > 1 && stack[stack.length - 1].level >= item.level) stack.pop();
    var node = {level: item.level, text: item.text, id: item.id, children: []};
    stack[stack.length - 1].children.push(node);
    stack.push(node);
  }
  return root;
}

function firstNodeTarget(node) {
  if (!node) return "";
  if (node.id) return node.id;
  for (var i = 0; node.children && i < node.children.length; i++) {
    var childTarget = firstNodeTarget(node.children[i]);
    if (childTarget) return childTarget;
  }
  return "";
}

function renderTocJump(node, idx) {
  var text = escHtml(node.text || "");
  var target = firstNodeTarget(node);
  if (idx === undefined || idx === null || !target) return text;
  return '<button type="button" class="home-toc-jump" onclick="event.stopPropagation();jumpToRead('+idx+',\''+escAttr(target)+'\')">'+text+'<\/button>';
}

function renderHomeTocNodes(nodes, idx) {
  if (!nodes || !nodes.length) return "";
  var html = '<ul class="home-toc-list">';
  for (var i = 0; i < nodes.length; i++) {
    var node = nodes[i];
    var children = renderHomeTocNodes(node.children, idx);
    html += '<li>';
    if (children) {
      html += '<div class="home-toc-node l'+node.level+'"><details open><summary>'+renderTocJump(node, idx)+'<\/summary>'+children+'<\/details><\/div>';
    } else {
      html += '<div class="home-toc-node leaf l'+node.level+'">'+renderTocJump(node, idx)+'<\/div>';
    }
    html += '<\/li>';
  }
  html += '<\/ul>';
  return html;
}

function renderHomeToc(toc) {
  if (!toc || !toc.length) return '<div class="home-toc-empty">正文没有可索引的标题结构<\/div>';
  return '<details class="home-toc" open><summary>目录索引<\/summary>'+renderHomeTocNodes(tocTree(toc))+'<\/details>';
}

function headingBucket(text) {
  var s = String(text || "");
  if (/光谱电化学|响应时间|透过率.*时间|二价峰|峰位|CA.*光谱|spectro/i.test(s)) return ["测试", "光谱电化学测试"];
  if (/膜厚|厚度|台阶仪|profil/i.test(s)) return ["测试", "膜厚测试"];
  if (/循环稳定|循环|保持率|衰减/i.test(s)) return ["测试", "循环稳定性测试"];
  if (/UV|Vis|透过率|吸收|光谱|色度|CIE/i.test(s)) return ["测试", "光学测试"];
  if (/CV|CA|计时电流|循环伏安|电化学|电压|chrono/i.test(s)) return ["测试", "电化学测试"];
  if (/SEM|TEM|EDS|AFM|FTIR|BET|XRD|形貌|结构|元素|红外|比表面积/i.test(s)) return ["测试", "形貌与结构表征"];
  if (/制备|配制|组装|封装|染浴|后处理|旋涂|刮涂|烧制|退火|样品|材料|器件|操作|步骤|FTO|TiO2|ATO|PBI/i.test(s)) return ["制备实验", ""];
  if (/数据|结果|观察|分析|质量|汇总|表|结论|小结|峰位|计算|校核/i.test(s)) return ["数据与分析", ""];
  if (/后续|下一步|计划|注意|备注|问题|异常|建议|改进/i.test(s)) return ["结论与后续", ""];
  return ["其他记录", ""];
}

function addChildNode(parent, text, level, id) {
  var node = {level: level, text: text, id: id || "", children: []};
  parent.children.push(node);
  return node;
}

function buildExperimentIndex(meta, body, toc) {
  var title = (meta && meta.title) ? String(meta.title).replace(/^\[[^\]]+\]\s*/, "") : "实验记录";
  var root = {level: 1, text: title, id: toc[0] && toc[0].id ? toc[0].id : "", children: []};
  var groups = {};
  function groupNode(name) {
    if (!groups[name]) groups[name] = addChildNode(root, name, 1);
    return groups[name];
  }
  var subgroups = {};
  function subgroupNode(parentName, subName) {
    var key = parentName + "::" + subName;
    if (!subgroups[key]) subgroups[key] = addChildNode(groupNode(parentName), subName, 2);
    return subgroups[key];
  }
  var contextByLevel = {};
  for (var i = 0; i < toc.length; i++) {
    var item = toc[i];
    var text = item.text;
    if (/^日期$|^实验记录[:：]|^数据记录[:：]/.test(text)) continue;
    var bucket = headingBucket(text);
    var parentBucket = null;
    for (var pl = item.level - 1; pl >= 1; pl--) {
      if (contextByLevel[pl]) { parentBucket = contextByLevel[pl]; break; }
    }
    if (parentBucket && parentBucket[0] === "测试" && item.level > 2) {
      if (bucket[0] === "测试" || bucket[0] === "其他记录" || /^(CA|CV)\b/i.test(text)) bucket = parentBucket;
    }
    contextByLevel[item.level] = bucket;
    for (var dl = item.level + 1; dl <= 3; dl++) delete contextByLevel[dl];
    var major = bucket[0], minor = bucket[1];
    var parent = minor ? subgroupNode(major, minor) : groupNode(major);
    addChildNode(parent, text, minor ? 3 : 2, item.id);
  }
  var ordered = ["制备实验", "测试", "数据与分析", "结论与后续", "其他记录"];
  var children = [];
  for (var oi = 0; oi < ordered.length; oi++) {
    if (groups[ordered[oi]] && groups[ordered[oi]].children.length) children.push(groups[ordered[oi]]);
  }
  root.children = children;
  return root.children.length ? [root] : tocTree(toc);
}

function renderHomeIndex(meta, body, toc, idx) {
  if (!toc || !toc.length) return '<div class="home-toc-empty">正文没有可索引的标题结构<\/div>';
  var nodes = meta && meta.type === "experiment" ? buildExperimentIndex(meta, body, toc) : tocTree(toc);
  return '<details class="home-toc" open><summary>目录索引<\/summary>'+renderHomeTocNodes(nodes, idx)+'<\/details>';
}

function rowIndexSummary(nodes, tocCount) {
  var source = nodes || [];
  if (source.length === 1 && source[0].children && source[0].children.length) source = source[0].children;
  var labels = [];
  for (var i = 0; i < source.length && labels.length < 4; i++) {
    if (source[i].text) labels.push(source[i].text);
  }
  var text = labels.length ? "目录 · " + labels.join(" / ") : "目录";
  return escHtml(text) + '<span class="row-toc-count">'+tocCount+'项<\/span>';
}

function renderRowIndex(meta, body, toc, idx) {
  if (!toc || toc.length < 3) return "";
  var nodes = meta && meta.type === "experiment" ? buildExperimentIndex(meta, body, toc) : tocTree(toc);
  if (!nodes || !nodes.length) return "";
  return '<details class="row-toc" onclick="event.stopPropagation()" onkeydown="event.stopPropagation()"><summary>'+rowIndexSummary(nodes, toc.length)+'<\/summary>'+renderHomeTocNodes(nodes, idx)+'<\/details>';
}

function extractKeyFacts(body) {
  var text = String(body || "").replace(/\s+/g, " ");
  var facts = [];
  function add(label, value, klass) {
    if (!value) return;
    var key = label + value;
    for (var i = 0; i < facts.length; i++) if (facts[i].key === key) return;
    facts.push({key:key,label:label,value:value,klass:klass||""});
  }
  var m;
  m = text.match(/(?:最高|最大|初始)?[^。；，,]{0,8}对比度[^0-9]{0,10}(\d+(?:\.\d+)?%)/);
  if (m) add("对比度", m[1], "good");
  m = text.match(/保持率[^0-9]{0,10}(\d+(?:\.\d+)?%)/);
  if (m) add("保持率", m[1], "good");
  m = text.match(/(?:着色时间|tau_c)[^0-9]{0,10}(\d+(?:\.\d+)?\s*s)/i);
  if (m) add("着色", m[1], "");
  m = text.match(/(?:褪色时间|tau_b)[^0-9]{0,10}(\d+(?:\.\d+)?\s*s)/i);
  if (m) add("褪色", m[1], "");
  m = text.match(/(\d+(?:\.\d+)?\s*nm)/i);
  if (m) add("波长", m[1], "");
  if (/无法|异常|问题|误选|needs_review|excluded/i.test(text)) add("注意", "需复核", "warn");
  var html = "";
  for (var f = 0; f < Math.min(facts.length, 5); f++) {
    html += '<span class="key-fact '+facts[f].klass+'"><span>'+escHtml(facts[f].label)+'<\/span><strong>'+escHtml(facts[f].value)+'<\/strong><\/span>';
  }
  return html ? '<div class="key-facts">'+html+'<\/div>' : "";
}

function togglePreview(el, idx) {

  ipHtml += '<div class="preview-grid">';
  ipHtml += '<div class="preview-panel preview-summary"><div class="preview-label">重点摘要<\/div>'+(summary ? renderMixedText(summary) : "暂无摘要")+extractKeyFacts(body)+'<div><button type="button" class="inline-link" onclick="openRead('+idx+')">查看全文 →<\/button><\/div><\/div>';
  ipHtml += '<div class="preview-panel">'+renderHomeIndex(m, body, toc, idx)+'<\/div>';
  ipHtml += '<\/div><\/div>';
  td.innerHTML = ipHtml;
  prev.appendChild(td);
  tr.parentNode.insertBefore(prev, tr.nextSibling);
  el.setAttribute("aria-expanded", "true");
}

function filter() {
  var tf = document.getElementById("fType").value;
  var sf = document.getElementById("fStat").value;
  var q = (document.getElementById("fQ").value || "").toLowerCase();
  var count = 0;
  var rows = document.querySelectorAll(".record-table tbody tr:not(.inline-preview)");
  for (var r = 0; r < rows.length; r++) {
    var tr = rows[r];
    var idx = parseInt(tr.getAttribute("data-idx"));
    if (isNaN(idx)) { tr.style.display = "none"; continue; }
    var d = DB[idx];
    if (!d) { tr.style.display = "none"; continue; }
    var m = parseFM(d.content);
    var body = getBody(d.content);
    var ok = true;
    if (tf && m.type !== tf) ok = false;
    if (sf && m.status !== sf) ok = false;
    if (q) {
      var searchStr = (m.title+" "+d.name+" "+(m.tags||[]).join(" ")+" "+(m.category||"")+" "+body).toLowerCase();
      if (searchStr.indexOf(q) < 0) ok = false;
    }
    tr.style.display = ok ? "" : "none";
    // Also hide adjacent inline preview
    var next = tr.nextElementSibling;
    if (next && next.classList.contains("inline-preview")) next.style.display = ok ? "" : "none";
    if (ok) count++;
  }
  // Hide empty month groups
  var groups = document.querySelectorAll(".month-group");
  for (var g = 0; g < groups.length; g++) {
    var visible = groups[g].querySelector(".record-table tbody tr:not(.inline-preview)[style*='display: none']");
    var anyVisible = groups[g].querySelector(".record-table tbody tr:not(.inline-preview):not([style*='display: none'])");
    var hasRows = groups[g].querySelector(".record-table tbody tr:not(.inline-preview)");
    if (hasRows && !anyVisible) {
      groups[g].style.display = "none";
    } else {
      groups[g].style.display = "";
    }
  }
  document.getElementById("filterCount").textContent = count + " 条";
}

function updateStats() {
  var now = new Date();
  var thisMonth = now.getFullYear() + "-" + String(now.getMonth()+1).padStart(2,"0");
  var total = DB.length, expCount = 0, planCount = 0, metCount = 0, monthCount = 0;
  for (var i = 0; i < DB.length; i++) {
    var m = parseFM(DB[i].content);
    if (m.type === "experiment") expCount++;
    if (m.type === "plan") planCount++;
    if (m.type === "method") metCount++;
    if (m.date && m.date.substring(0,7) === thisMonth) monthCount++;
  }
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statExp").textContent = expCount;
  document.getElementById("statPlan").textContent = planCount;
  document.getElementById("statMet").textContent = metCount;
  document.getElementById("statMonth").textContent = monthCount;
}

function renderRelated(rel) {
  if (!rel || !rel.length) return '<span style="font-size:12px;color:var(--c-muted)">暂无</span>';

    html += '<span class="rel-chip dim">'+escHtml(rel[i])+'<\/span>';
  }
  return html;
}

function scrollToRaw() {
  var raw = document.getElementById("rawSource");
  if (raw) raw.open = true;

  if (raw) raw.scrollIntoView({behavior:prefersReduced ? "auto" : "smooth", block:"start"});
}

// ====== EDIT VIEW ======
var READ_ONLY_MSG = "网页为只读视图：修改请编辑对应 md 文件后运行 sync-data.py，或直接让 AI 修改。";
function readOnlyGuard() { showToast(READ_ONLY_MSG); return true; }

function openEditor(idx) {
  readOnlyGuard();
  return;
  curIdx = idx;
  dirty = false;
  var d = DB[idx];
  var m = parseFM(d.content);
  var body = getBody(d.content);
  
  document.getElementById("listView").style.display = "none";
  document.getElementById("readView").style.display = "none";
  document.getElementById("editView").style.display = "";
  document.getElementById("editTitle").textContent = m.title || d.name;
  document.getElementById("dirtyTag").style.display = "none";
  document.getElementById("saveStatus").textContent = "";
  
  // Build edit body
  var fields = [
    {key:"type",label:"类型",type:"select",options:TYPES},
    {key:"title",label:"标题",type:"text"},
    {key:"date",label:"日期",type:"text"},
    {key:"category",label:"分类",type:"text"},
    {key:"project",label:"项目",type:"text"},
    {key:"status",label:"状态",type:"select",options:STATUS_LABELS},
    {key:"priority",label:"优先级",type:"text"},
    {key:"due",label:"截止日",type:"text"},
    {key:"tags",label:"标签（逗号分隔）",type:"text"}
  ];
  var panelBody = "";
  for (var i = 0; i < fields.length; i++) {
    var f = fields[i];
    var val = m[f.key] || "";
    if (f.key === "tags" && Array.isArray(val)) val = val.join(", ");
    panelBody += '<div><label for="fm_'+f.key+'">'+f.label+'<\/label>';
    if (f.type === "select") {
      panelBody += '<select id="fm_'+f.key+'" name="fm_'+f.key+'" autocomplete="off" onchange="markDirty()"><option value=""><\/option>';
      for (var k in f.options) {
        if (f.options.hasOwnProperty(k)) panelBody += '<option value="'+k+'"'+(k===val?' selected':'')+'>'+f.options[k]+'<\/option>';
      }
      panelBody += '<\/select>';
    } else {
      panelBody += '<input id="fm_'+f.key+'" name="fm_'+f.key+'" autocomplete="off" value="'+escHtml(String(val))+'" oninput="markDirty()">';
    }
    panelBody += '<\/div>';
  }
  
  var html = '';
  html += '<div class="edit-panel" id="metaPanel">';
  html += '<button type="button" class="edit-panel-header" onclick="toggleMetaPanel(this)" aria-expanded="true"><span class="chevron" aria-hidden="true">▼<\/span> 元数据<\/button>';
  html += '<div class="edit-panel-body">'+panelBody+'<\/div><\/div>';
  
  html += '<div class="edit-body-area">';
  html += '<div class="edit-tabs" role="tablist" aria-label="正文编辑模式"><button type="button" class="tab active" id="tabEdit" role="tab" aria-selected="true" aria-controls="edBody" onclick="switchTab(0)">编辑<\/button><button type="button" class="tab" id="tabPrev" role="tab" aria-selected="false" aria-controls="pvPane" onclick="switchTab(1)">预览<\/button><\/div>';
  html += '<textarea class="edit-textarea" id="edBody" name="record-body" aria-label="记录正文" autocomplete="off" spellcheck="false" oninput="markDirty()">'+escHtml(body)+'<\/textarea>';
  html += '<div class="preview-pane" id="pvPane" role="tabpanel" aria-labelledby="tabPrev"><\/div><\/div>';
  
  html += '<div class="edit-actions"><span style="font-size:11px;color:var(--c-muted);font-family:var(--font-ui)">Ctrl+S 保存<\/span><\/div>';
  
  document.getElementById("editBody").innerHTML = html;
  switchTab(0);
  window.scrollTo(0,0);
  setTimeout(function(){ document.getElementById("edBody").focus(); }, 100);
}

function toggleMetaPanel(btn) {
  var panel = document.getElementById("metaPanel");
  panel.classList.toggle("collapsed");
  btn.setAttribute("aria-expanded", panel.classList.contains("collapsed") ? "false" : "true");
}

function switchTab(n) {
  document.getElementById("tabEdit").className = "tab" + (n===0?" active":"");
  document.getElementById("tabPrev").className = "tab" + (n===1?" active":"");
  document.getElementById("tabEdit").setAttribute("aria-selected", n===0 ? "true" : "false");
  document.getElementById("tabPrev").setAttribute("aria-selected", n===1 ? "true" : "false");
  document.getElementById("edBody").style.display = n===0?"":"none";
  document.getElementById("pvPane").style.display = n===1?"":"none";
  if (n===1) document.getElementById("pvPane").innerHTML = renderMarkdown(document.getElementById("edBody").value);
}

function readMetaForm() {
  var m = {};
  var fields = ["type","title","date","category","project","status","priority","due","tags"];
  for (var i = 0; i < fields.length; i++) {
    var el = document.getElementById("fm_"+fields[i]);
    if (el) {
      var v = el.value.trim();
      if (fields[i] === "tags") { m.tags = v ? v.split(",").map(function(s){return s.trim()}).filter(Boolean) : []; }
      else { m[fields[i]] = v; }
    }
  }
  return m;
}

function doSave() {
  readOnlyGuard();
  return;
  if (curIdx < 0) return;
  var meta = readMetaForm();
  var body = document.getElementById("edBody").value;
  meta.modified = new Date().toISOString().slice(0,10);
  if (!meta.date) meta.date = meta.modified;
  DB[curIdx].content = fmToString(meta) + "\n\n" + body;
  saveDB();
  dirty = false;
  document.getElementById("dirtyTag").style.display = "none";
  syncRecordToDisk(DB[curIdx]);
  showToast("已保存，正在同步到 GitHub Pages");
  // Return to read view
  openRead(curIdx);
}

function markDirty() {
  if (curIdx < 0) return;
  dirty = true;
  document.getElementById("dirtyTag").style.display = "inline";
}

function doDelete() {
  readOnlyGuard();
  return;
  if (curIdx < 0) return;
  if (!confirm("确定删除「"+(parseFM(DB[curIdx].content).title||DB[curIdx].name)+"」？")) return;
  var deleted = DB[curIdx];
  DB.splice(curIdx,1);
  saveDB();
  syncDeleteFromDisk(deleted);
  goBack();
  showToast("已删除，正在同步到 GitHub Pages");
}

function goBack() {
  if (dirty && !confirm("有未保存的修改，放弃？")) return;
  curIdx = -1;
  dirty = false;
  document.getElementById("readView").style.display = "none";
  document.getElementById("listView").style.display = "";
  renderList();
  updateStats();
  populateFilters();
  window.scrollTo(0,0);
}

function showNewMenu() {

  return;

function newRec(type) {
  readOnlyGuard();
  return;
  closeNewMenu();

  document.getElementById("modalNameInput").value = "";
  document.getElementById("modalName").classList.add("show");
  document.getElementById("modalNameOk").onclick = function(){
    var name = document.getElementById("modalNameInput").value.trim();
    if (!name) return;
    if (name.indexOf(".md") < 0) name += ".md";
    var today = new Date().toISOString().slice(0,10);
    var title = name.replace(".md","");
    var content = "---\ntype: "+type+"\ntitle: "+title+"\ndate: "+today+"\ntags: []\nmodified: "+today+"\n---\n\n# "+(TYPES[type]||type)+"记录\n";
    DB.push({folder:folderForType(type),name:name,content:content});

    closeNameModal();

  };

// ====== EXPORT/IMPORT ======
function doExportAll() {
  for (var i = 0; i < DB.length; i++) {
    var blob = new Blob([DB[i].content],{type:"text/markdown"});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = DB[i].name;
    a.click();
  }
  showToast("已导出 "+DB.length+" 个文件");
}
function doImport() {
  readOnlyGuard();
  return;
  var inp = document.createElement("input");
  inp.type = "file"; inp.accept = ".md"; inp.multiple = true;
  inp.onchange = function(){
    var files = Array.from(inp.files);
    var loaded = 0;
    files.forEach(function(f){
      var reader = new FileReader();
      reader.onload = function(e){
        var c = e.target.result;
        if (c.charCodeAt(0)===0xFEFF) c = c.slice(1);
        var found = -1;
        for (var j=0;j<DB.length;j++){ if(DB[j].name===f.name){found=j;break;} }
        if (found>=0) DB[found].content = c;
        else { var pm = parseFM(c); DB.push({folder:folderForType(pm.type||"method"),name:f.name,content:c}); }
        loaded++;
        if (loaded===files.length){ saveDB(); location.reload(); }
      };
      reader.readAsText(f);
    });
  };
  inp.click();
}

// ====== UTILS ======
function saveDB() { try { localStorage.setItem("labdb",JSON.stringify(DB)); } catch(e) {} }
function folderForType(type) { return TYPE_FOLDERS[type] || "notes"; }
function syncRecordToDisk(record) {
  if (!record || location.protocol === "file:") return;
  fetch("/api/save", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(record)
  }).then(function(res){
    return res.json().then(function(data){
      if (!res.ok || !data.ok) throw new Error(data.error || "同步失败");
      showToast(data.message || "已保存并推送到 GitHub Pages");
    });
  }).catch(function(err){
    showToast("同步失败：请检查服务器窗口、网络代理或 GitHub 认证");
    console.error(err);
  });
}
function syncDeleteFromDisk(record) {
  if (!record || location.protocol === "file:") return;
  fetch("/api/delete", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({folder: record.folder, name: record.name})
  }).then(function(res){
    return res.json().then(function(data){
      if (!res.ok || !data.ok) throw new Error(data.error || "同步失败");
      showToast(data.message || "已删除并推送到 GitHub Pages");
    });
  }).catch(function(err){
    showToast("同步失败：请检查服务器窗口、网络代理或 GitHub 认证");
    console.error(err);
  });
}
function showToast(msg) {
  var el = document.getElementById("toast");
  el.textContent = msg;
  el.className = "toast show";
  setTimeout(function(){ el.className = "toast"; },2000);
}

document.addEventListener("keydown",function(e){
  if ((e.ctrlKey||e.metaKey) && e.key==="s") { e.preventDefault(); }
  if (e.key==="Escape") { if (curIdx>=0) goBack(); }
});

// ====== PASSWORD ======
var PW_UNLOCKED = false;
var PW_HASH = "9b7c0087c732664dca4dda5f65f36c6ca7c3b3c0225956bc6feb0cfab6ef6879";
function checkPassword() {
  document.getElementById("pwGate").style.display = "flex";
  document.getElementById("listView").classList.add("pw-locked");
  document.getElementById("pwInput").addEventListener("keydown", function(e) {
    if (e.key === "Enter") tryUnlock();
  });
  document.getElementById("pwInput").focus();
}
async function tryUnlock() {
  var input = document.getElementById("pwInput").value;
  if (!input) return;
  var hash = await sha256(input);
  if (hash === PW_HASH) {
    PW_UNLOCKED = true;
    document.getElementById("pwGate").style.display = "none";
    document.getElementById("listView").classList.remove("pw-locked");
  } else {
    document.getElementById("pwMsg").style.display = "block";
    document.getElementById("pwInput").value = "";
    document.getElementById("pwInput").focus();
  }
}
async function sha256(msg) {
  var enc = new TextEncoder().encode(msg);
  var buf = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
