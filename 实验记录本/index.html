<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>实验记录本</title>
<meta name="theme-color" content="#f6f8f7">
<link rel="stylesheet" href="styles.css?v=1">
</head>
<body>
<a class="skip-link" href="#listContent">跳到记录列表</a>
<!-- ====== PASSWORD GATE ====== -->
<style>
.pw-gate{position:fixed;inset:0;z-index:999;background:
  linear-gradient(90deg, rgba(29,78,216,.05) 1px, transparent 1px) 0 0/44px 44px,
  linear-gradient(0deg, rgba(249,115,22,.05) 1px, transparent 1px) 0 0/44px 44px,
  #f6f8f7;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;font-family:var(--font-ui)}
.pw-gate h2{font-size:20px;font-weight:700;color:var(--c-text);font-family:var(--font-text);text-wrap:balance}
.pw-gate h2:before{content:"EC";display:grid;place-items:center;width:38px;height:38px;margin:0 auto 10px;border-radius:8px;background:linear-gradient(135deg,#1d4ed8,#f97316);color:#fff;font-family:var(--font-ui);font-size:11px;font-weight:800;letter-spacing:.08em}
.pw-gate input{padding:9px 14px;border:1px solid var(--c-border-strong);border-radius:8px;font-size:14px;text-align:center;width:220px;background:#fff;color:var(--c-text);box-shadow:var(--shadow-sm)}
.pw-gate input:focus{border-color:var(--c-pbi)}
.pw-gate .pw-msg{font-size:12px;color:#dc2626;display:none}
.pw-locked{display:none!important}
</style>
<div class="pw-gate" id="pwGate">
<h2>实验记录本</h2>
<label class="visually-hidden" for="pwInput">访问密码</label>
<input type="password" id="pwInput" name="notebook-password" autocomplete="current-password" placeholder="请输入密码…" aria-describedby="pwMsg" autofocus>
<div class="pw-msg" id="pwMsg" aria-live="polite">密码错误，请重新输入</div>
</div>

<!-- ====== LIST VIEW ====== -->
<div id="listView">
  <div class="topbar">
    <div class="brand-lockup">
      <span class="brand-mark" aria-hidden="true">EC</span>
      <h1>实验记录本<span class="brand-context">Electrochromic Notebook</span></h1>
    </div>
    <span class="spacer"></span>
    <div class="stats">
      <span>总计 <b id="statTotal">0</b></span>
      <span>实验 <b id="statExp">0</b></span>
      <span>方案 <b id="statPlan">0</b></span>
      <span>实验方法 <b id="statMet">0</b></span>
      <span>本月 <b id="statMonth">0</b></span>
    </div>
    <button class="btn ghost" id="btnTheme" onclick="toggleTheme()" title="切换配色主题">主题</button>
    <button class="btn ghost" id="btnDensity" onclick="toggleDensity()" title="切换紧凑/舒适">密度</button>
    <button class="btn ghost" onclick="doExportAll()">导出</button>
  </div>
  <div class="filters">
    <label class="visually-hidden" for="fType">按类型筛选</label>
    <select id="fType" name="record-type-filter" autocomplete="off" onchange="filter()"><option value="">全部类型</option></select>
    <label class="visually-hidden" for="fStat">按状态筛选</label>
    <select id="fStat" name="status-filter" autocomplete="off" onchange="filter()"><option value="">全部状态</option></select>
    <label class="visually-hidden" for="fQ">全文搜索</label>
    <input class="search" id="fQ" name="record-search" type="search" autocomplete="off" spellcheck="false" oninput="filter()" placeholder="全文搜索（标题 · 标签 · 正文）…">
    <span class="cnt" id="filterCount" aria-live="polite"></span>
  </div>
  <div class="facets" id="facetBar"></div>
  <div class="active-filters" id="activeFilters"></div>
  <main class="main-area list" id="listContent" tabindex="-1"></main>
</div>

<!-- ====== READ VIEW ====== -->
<div id="readView" style="display:none">
  <div class="topbar">
    <button class="btn ghost" onclick="goBack()">← 返回列表</button>
    <span class="spacer"></span>
  </div>
  <div class="main-area read" id="readContent"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- 数据已外置到同目录 data.js，本文件只做壳 -->
<script>document.write('<script src="data.js?v=20260714-experiment-index&t='+Date.now()+'"><\/script>');</script>

<script src="app.js?v=1"></script>
